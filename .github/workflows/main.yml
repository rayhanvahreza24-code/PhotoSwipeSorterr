name: Build Photo Swipe Sorter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          echo "Daftar file repository:"
          ls -la
          ZIP=$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "File ZIP tidak ditemukan!"
            exit 1
          fi
          echo "Mengekstrak: $ZIP"
          mkdir project
          unzip -o "$ZIP" -d project
          ROOT=$(dirname "$(find project -name settings.gradle.kts | head -n 1)")
          test -f "$ROOT/settings.gradle.kts"
          cp -a "$ROOT"/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSwipeSorter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
