name: Build Photo Swipe Sorter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o PhotoSwipeSorter-main.zip -d project
          find project -name settings.gradle.kts -print
          ROOT=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          cp -a "$ROOT"/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSwipeSorter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
